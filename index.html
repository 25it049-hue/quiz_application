
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Interactive Quiz</h1>

        <h2 id="question">Question appears here</h2>

        <div id="answer-buttons" class="answer-buttons"></div>

        <p id="feedback"></p>

        <button id="next-btn" class="next-btn" hidden>
            Next Question
        </button>

        <p id="score"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
